<!doctype html>
<html lang="es" data-theme="obscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Modo God — Obscuro Mediaworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#070504; --ink-800:#0a0a0a; --ink-700:#0f0f0f; --ink-600:#161513;
    --cream:#f5e9d4; --gold:#c9a96e; --gold-dim:#a1854f; --rec:#ff1f3e;
    --ok:#6ab04c; --warn:#e2b33c;
    --font-display:"Cormorant Garamond",Georgia,serif;
    --font-sans:"Space Grotesk","Helvetica Neue",Arial,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,monospace;
    --line:rgba(201,169,110,.18);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink-900);color:var(--cream);font-family:var(--font-sans);
       font-weight:300;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px 80px}

  header{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:32px;
         display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
  h1{font-family:var(--font-display);font-weight:300;font-size:clamp(40px,7vw,72px);
     line-height:.9;letter-spacing:-.03em;margin:0}
  h1 small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-weight:400}
  .header-right{display:flex;align-items:center;gap:14px}
  .meta{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:#8a8175;text-align:right}
  .meta b{color:var(--cream);font-weight:500}
  .stale{color:var(--rec)}
  #sync-btn{flex:none;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;background:transparent;color:var(--gold);border:1px solid var(--gold-dim);
    padding:9px 16px;cursor:pointer;white-space:nowrap}
  #sync-btn:hover{background:var(--gold);color:var(--ink-900)}
  #sync-btn:disabled{opacity:.5;cursor:default;background:transparent;color:var(--gold)}

  h2{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
     color:var(--gold);font-weight:400;margin:48px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--line)}

  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .card{background:var(--ink-700);border:1px solid var(--line);padding:20px 22px 18px;
        display:flex;flex-direction:column;gap:12px}
  .card.p1{border-color:var(--gold)}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .name{font-family:var(--font-display);font-size:28px;line-height:1;letter-spacing:-.02em}
  .badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
         border:1px solid var(--line);padding:3px 8px;color:#8a8175;white-space:nowrap}
  .badge.launch{border-color:var(--rec);color:var(--rec)}
  .badge.production{border-color:var(--gold);color:var(--gold)}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;padding:2px 8px;
        background:var(--ink-600);border:1px solid transparent;color:#a9a094}
  .chip.clean{color:var(--ok)}
  .chip.dirty{color:var(--warn);border-color:rgba(226,179,60,.35)}
  .chip.ahead{color:var(--rec);border-color:rgba(255,31,62,.35)}
  .chip.branch{color:var(--gold);border-color:var(--line)}
  .chip.err{color:var(--rec);border-color:var(--rec)}

  .commit{font-family:var(--font-mono);font-size:11.5px;line-height:1.5;color:#8a8175;
          border-left:2px solid var(--line);padding-left:10px}
  .commit b{color:var(--cream);font-weight:500}
  .commit .subject{display:block;color:#a9a094;margin-top:2px;
                   overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
                   -webkit-line-clamp:2;-webkit-box-orient:vertical}

  .rowline{display:flex;justify-content:space-between;gap:10px;font-family:var(--font-mono);
           font-size:11px;color:#8a8175;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
  .roles{display:flex;gap:5px}
  .role{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);
        font-size:10px;letter-spacing:0;color:var(--gold);text-transform:uppercase}
  .ship{color:var(--rec)}

  .session-row{display:flex;gap:8px;align-items:center}
  .session-open,.session-copy{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;
    text-transform:uppercase;background:transparent;border:1px solid var(--gold-dim);color:var(--gold);
    padding:6px 10px;cursor:pointer;white-space:nowrap}
  .session-open:hover,.session-copy:hover{background:var(--gold);color:var(--ink-900);text-decoration:none}
  .session-copy{border-style:dashed;border-color:var(--line);color:#8a8175}
  .session-copy:hover{background:transparent;color:var(--cream);border-color:var(--line)}
  .session-copy.done{color:var(--ok);border-color:var(--ok)}

  .hl{margin:0;padding:0 0 0 16px;font-size:12px;color:#a9a094;line-height:1.5}
  .hl li{margin-bottom:2px}
  .hl li::marker{color:var(--rec)}
  .pulse{display:flex;align-items:flex-end;gap:2px;height:18px}
  .pulse i{width:4px;background:var(--gold-dim);display:block}

  table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12px}
  td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--gold);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
  td.muted{color:#8a8175}

  .decisions{display:flex;flex-direction:column;gap:14px}
  .decision{background:var(--ink-700);border:1px solid var(--line);padding:18px 20px}
  .decision-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .decision-meta{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:#8a8175;display:flex;gap:12px}
  .decision-q{font-family:var(--font-display);font-size:21px;margin:0 0 6px;line-height:1.25}
  .decision-ctx{font-size:12.5px;color:#a9a094;margin:0 0 12px;line-height:1.55}
  .opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .opt{border:1px solid var(--line);padding:9px 12px;display:flex;align-items:center;gap:14px}
  .opt.rec{border-color:var(--gold);background:rgba(201,169,110,.07)}
  .opt-text{flex:1;min-width:0}
  .opt-label{display:block;font-size:12.5px;color:var(--cream)}
  .opt.rec .opt-label{color:var(--gold)}
  .opt-why{display:block;color:#8a8175;font-size:11.5px;margin-top:3px;line-height:1.4}
  .opt-pick{flex:none;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;background:transparent;color:var(--gold);border:1px solid var(--gold-dim);
    padding:7px 12px;cursor:pointer}
  .opt-pick:hover{background:var(--gold);color:var(--ink-900)}
  .opt-pick:disabled{opacity:.4;cursor:default;background:transparent;color:var(--gold)}
  .decision-other{margin:10px 0 0;background:transparent;border:1px dashed var(--line);color:#8a8175;
    font-family:var(--font-mono);font-size:11px;padding:7px 12px;cursor:pointer}
  .decision-other:hover{color:var(--cream);border-color:var(--line)}
  .decision-note{font-family:var(--font-mono);font-size:11px;color:#8a8175;margin:10px 0 0}
  .decision-note code{color:var(--gold)}

  .gdd-card{background:var(--ink-700);border:1px solid var(--line);padding:18px 20px;
    display:flex;flex-direction:column;gap:10px}
  .gdd-name{font-family:var(--font-display);font-size:22px;line-height:1}
  .gdd-meta{font-family:var(--font-mono);font-size:11px;color:#8a8175}
  .gdd-open{align-self:flex-start;font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;background:transparent;color:var(--gold);border:1px solid var(--gold-dim);
    padding:8px 14px;cursor:pointer}
  .gdd-open:hover{background:var(--gold);color:var(--ink-900)}
  .gdd-missing{color:#6f675d;font-size:11.5px}

  #gdd-modal{position:fixed;inset:0;background:rgba(7,5,4,.88);display:none;
    align-items:center;justify-content:center;z-index:100;padding:24px}
  #gdd-modal.open{display:flex}
  #gdd-modal .frame{width:100%;height:100%;max-width:1100px;background:var(--ink-900);
    border:1px solid var(--line);display:flex;flex-direction:column}
  #gdd-modal .bar{display:flex;justify-content:space-between;align-items:center;
    padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--font-mono);
    font-size:11px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase}
  #gdd-modal .bar button{background:transparent;border:1px solid var(--line);color:var(--cream);
    font-family:var(--font-mono);font-size:14px;line-height:1;padding:6px 10px;cursor:pointer}
  #gdd-modal .bar button:hover{border-color:var(--gold);color:var(--gold)}
  #gdd-modal iframe{flex:1;border:0;width:100%;background:#fff}

  .empty{font-family:var(--font-mono);font-size:12px;color:#8a8175;border:1px dashed var(--line);padding:16px}
  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);
         font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:#6f675d}
  @media(max-width:600px){.wrap{padding:28px 16px 60px}.meta{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><small>Obscuro Mediaworks · operaciones</small>Modo God</h1>
    <div class="header-right">
      <button id="sync-btn" type="button" style="display:none">↻ Sincronizar</button>
      <div class="meta" id="meta">cargando…</div>
    </div>
  </header>
  <div id="app"><div class="empty">Leyendo el snapshot…</div></div>
  <footer id="foot"></footer>
</div>

<div id="gdd-modal">
  <div class="frame">
    <div class="bar"><span id="gdd-modal-title"></span><button id="gdd-modal-close" type="button">✕</button></div>
    <iframe id="gdd-modal-frame" title="GDD"></iframe>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
// El backend (consola local vs Worker público) declara qué puede hacer en snapshot.capabilities.
// Local: decide=true (POST /api/decide), sync=false (ya es en vivo, no necesita botón).
// Worker público: decide=false (nadie resuelve decisiones sin contexto), sync=true (botón).
let CAPS = { decide: false, sync: false };
let SNAP = null; // último snapshot renderizado, para que el modal de GDD busque por slug
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ago(iso){
  if(!iso) return "—";
  const d = (Date.now() - new Date(iso)) / 1000;
  if (d < 90) return "recién";
  if (d < 5400) return Math.round(d/60) + " min";
  if (d < 172800) return Math.round(d/3600) + " h";
  return Math.round(d/86400) + " d";
}
function daysTo(date){
  if(!date) return null;
  return Math.ceil((new Date(date + "T00:00:00") - Date.now()) / 86400000);
}

function gitChips(g){
  if(!g || !g.ok) return `<span class="chip err">git: ${esc(g && g.error || "sin datos")}</span>`;
  const c = [`<span class="chip branch">${esc(g.branch)}</span>`];
  if (g.source === "github") {
    c.push(`<span class="chip dirty">GitHub — sin ver uncommitted</span>`);
    return c.join("");
  }
  if(g.dirty) c.push(`<span class="chip dirty">${g.dirty} sin commitear</span>`);
  if(g.untracked) c.push(`<span class="chip dirty">${g.untracked} sin trackear</span>`);
  if(!g.dirty && !g.untracked) c.push(`<span class="chip clean">limpio</span>`);
  if(g.ahead) c.push(`<span class="chip ahead">↑${g.ahead} sin pushear</span>`);
  if(g.behind) c.push(`<span class="chip dirty">↓${g.behind} atrás</span>`);
  if(g.upstream === null) c.push(`<span class="chip dirty">sin upstream</span>`);
  return c.join("");
}

function pulse(g){
  const w = (g && g.commits_7d) || 0, m = (g && g.commits_30d) || 0;
  const bars = [w, Math.max(0, m - w)].map(n => {
    const h = Math.min(18, 2 + n * 1.2);
    return `<i style="height:${h}px"></i>`;
  }).join("");
  return `<span title="${w} commits en 7d · ${m} en 30d">${w}/${m} <span class="pulse">${bars}</span></span>`;
}

function sessionHref(p){
  let href = "claude-cli://open?q=" + encodeURIComponent(p.trigger);
  if (p.repo_path) href += "&cwd=" + encodeURIComponent(p.repo_path);
  return href;
}

function card(p){
  const g = p.git, lc = g && g.last_commit;
  const d = daysTo(p.ships_on);
  const ship = d === null ? "" :
    `<span class="ship">lanza en ${d} d</span>`;
  const session = p.trigger
    ? `<div class="rowline session-row" style="border-top:none;padding-top:0;margin-top:-4px">
        <a class="session-open" href="${esc(sessionHref(p))}"
          title="Abre Claude Code local con el trigger precargado. Necesita el handler claude-cli:// registrado en esta máquina (se registra solo al mandar el primer prompt de una sesión interactiva).">▶ Sesión</a>
        <button class="session-copy" type="button" data-trigger="${esc(p.trigger)}"
          title="Por si el enlace no abre nada: copia el trigger para pegarlo a mano en una sesión de Claude Code.">⧉ Copiar trigger</button>
      </div>`
    : "";
  const a = p.asana;
  const asana = a
    ? `<a href="https://app.asana.com/0/${esc(p.asana_project_gid)}" target="_blank" rel="noopener"
        >${a.open}/${a.total} abiertas</a>` +
      (a.overdue ? ` <span class="chip ahead">${a.overdue} vencidas</span>` : "")
    : (p.asana_project_gid
        ? `<a href="https://app.asana.com/0/${esc(p.asana_project_gid)}" target="_blank" rel="noopener">Asana</a>`
        : `<span class="chip dirty">sin board</span>`);
  const hl = a && a.highlights && a.highlights.length
    ? `<ul class="hl">${a.highlights.slice(0,6).map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : "";
  return `
  <article class="card ${p.priority === 1 ? "p1" : ""}">
    <div class="card-top">
      <span class="name">${esc(p.name)}</span>
      <span class="badge ${esc(p.status)}">${esc(p.status)}</span>
    </div>
    <div class="chips">${gitChips(g)}</div>
    ${lc ? `<div class="commit"><b>${esc(lc.hash)}</b> · ${ago(lc.date)} · ${esc(lc.author)}
      <span class="subject">${esc(lc.subject)}</span></div>` : ``}
    ${hl}
    <div class="rowline">
      <span>${pulse(g)}</span>
      <span>${asana}</span>
    </div>
    <div class="rowline" style="border-top:none;padding-top:0;margin-top:-4px">
      <span class="roles">${(p.roles||[]).map(r =>
        `<span class="role" title="${esc(r)}">${esc(r[0])}</span>`).join("")}</span>
      <span>${ship || esc(p.engine || "")}</span>
    </div>
    ${session}
  </article>`;
}

function decisionCard(d){
  const due = d.due_on ? `<span>vence ${esc(d.due_on)}</span>` : "";
  const link = d.asana_task_gid
    ? `<a href="https://app.asana.com/0/0/${esc(d.asana_task_gid)}" target="_blank" rel="noopener">Asana ↗</a>` : "";
  const opts = (d.options||[]).map((o,i) => `
    <li class="opt ${o.recommended ? "rec" : ""}">
      <div class="opt-text">
        <span class="opt-label">${o.recommended ? "★ " : ""}${esc(o.label)}</span>
        <span class="opt-why">${esc(o.why)}</span>
      </div>
      ${CAPS.decide ? `<button class="opt-pick" data-decide="${esc(d.id)}" data-idx="${i}">Elegir</button>` : ""}
    </li>`).join("");
  return `
  <article class="decision" data-decision-id="${esc(d.id)}">
    <div class="decision-top">
      <span class="chip branch">${esc(d.project || "estudio")}</span>
      ${d.status === "investigating" ? `<span class="chip dirty">investigando</span>` : ""}
      <span class="decision-meta">${due}${link}</span>
    </div>
    <p class="decision-q">${esc(d.question)}</p>
    <p class="decision-ctx">${esc(d.context)}</p>
    <ul class="opts">${opts}</ul>
    ${CAPS.decide
      ? `<button class="decision-other" data-decide-other="${esc(d.id)}">Resolver de otra forma…</button>`
      : `<p class="decision-note">Para elegir, abrí la consola local: <code>python studio/modo-god/modo-god.py</code></p>`}
  </article>`;
}

function gddCard(p){
  if (!p.gdd) {
    return `
    <article class="gdd-card">
      <span class="gdd-name">${esc(p.name)}</span>
      <span class="gdd-missing">Sin GDD sincronizado.</span>
    </article>`;
  }
  return `
  <article class="gdd-card">
    <span class="gdd-name">${esc(p.name)}</span>
    <span class="gdd-meta">sincronizado ${esc(ago(p.gdd.synced_at))}</span>
    <button class="gdd-open" data-gdd="${esc(p.slug)}" type="button">Ver GDD</button>
  </article>`;
}

function openGdd(slug){
  if (!SNAP) return;
  const p = SNAP.projects.find(x => x.slug === slug);
  if (!p || !p.gdd) return;
  $("#gdd-modal-title").textContent = p.name;
  $("#gdd-modal-frame").srcdoc = p.gdd.html;
  $("#gdd-modal").classList.add("open");
}

function closeGdd(){
  $("#gdd-modal").classList.remove("open");
  $("#gdd-modal-frame").srcdoc = "";
}

async function sendDecision(id, optionIndex, note, triggerEl){
  const card = triggerEl.closest(".decision");
  const buttons = card.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  card.style.opacity = ".45";
  try {
    const r = await fetch("api/decide", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id, option_index: optionIndex, note})
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || ("HTTP " + r.status));
    card.style.transition = "opacity .2s";
    card.style.opacity = "0";
    setTimeout(() => location.reload(), 200);
  } catch (err) {
    buttons.forEach(b => b.disabled = false);
    card.style.opacity = "1";
    alert("No se pudo guardar la decisión: " + err.message);
  }
}

function render(s){
  SNAP = s;
  const gen = new Date(s.generated_at);
  const stale = (Date.now() - gen) > 86400000;
  $("#meta").innerHTML =
    `snapshot: <b class="${stale ? "stale" : ""}">${ago(s.generated_at)}</b>` +
    (stale ? ` <span class="stale">— desactualizado</span>` : "") +
    `<br>${esc(gen.toLocaleString("es-AR"))} · ${esc(s.generated_on || "")}` +
    `<br>Asana: ${s.asana_cache && s.asana_cache.present
      ? esc(ago(s.asana_cache.generated_at)) : "<span class='stale'>sin caché</span>"}`;

  const games = s.projects.filter(p => p.kind === "game");
  const other = s.projects.filter(p => p.kind !== "game");

  $("#app").innerHTML = `
    <h2>Juegos</h2>
    <div class="grid">${games.map(card).join("")}</div>
    <h2>Estudio y clientes</h2>
    <div class="grid">${other.map(card).join("")}</div>
    <h2>GDD</h2>
    <div class="grid">${games.map(gddCard).join("")}</div>
    <h2>Decisiones pendientes — tu turno${s.decisions && s.decisions.length ? ` (${s.decisions.length})` : ""}</h2>
    <div class="decisions">${
      s.decisions && s.decisions.length
        ? s.decisions.map(decisionCard).join("")
        : `<div class="empty">Nada esperando decisión ahora mismo.</div>`
    }</div>
    <h2>Agentes</h2>
    <table><tr><th>Rol</th><th>Agente</th><th>Superficie</th><th>Brief</th></tr>
      ${(s.roles||[]).map(r => `<tr>
        <td>${esc(r.name)}</td><td>om-${esc(r.id)}</td>
        <td class="muted">${esc(r.surface)}</td><td class="muted">${esc(r.brief)}</td></tr>`).join("")}
    </table>`;

  $("#sync-btn").style.display = CAPS.sync ? "" : "none";

  $("#foot").textContent = CAPS.decide
    ? "El estado de git sale del disco local en vivo. El de Asana es una caché que escribe un agente. " +
      "Elegir una opción en \"Decisiones pendientes\" la guarda en decisions.json — es lo único que esta consola escribe."
    : CAPS.sync
    ? "El estado de git y GDD viene de GitHub (no ve cambios sin pushear). Asana es en vivo solo si hay ASANA_TOKEN configurado. " +
      "\"Sincronizar\" pega a esas APIs de nuevo y guarda el resultado — no depende de ninguna sesión de Claude ni del disco local."
    : "El estado de git sale del disco local. El de Asana es una caché que escribe un agente. " +
      "Esta página no ejecuta nada — es un espejo.";
}

async function runSync(){
  const btn = $("#sync-btn");
  btn.disabled = true;
  btn.textContent = "Sincronizando…";
  try {
    const r = await fetch("api/sync", { method: "POST" });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || ("HTTP " + r.status));
    location.reload();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "↻ Sincronizar";
    alert("No se pudo sincronizar: " + err.message);
  }
}
$("#sync-btn").addEventListener("click", runSync);

async function copyTrigger(btn){
  const text = btn.getAttribute("data-trigger");
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    window.prompt("No pude copiar solo — copiá a mano:", text);
    return;
  }
  btn.textContent = "✓ Copiado";
  btn.classList.add("done");
  setTimeout(() => { btn.textContent = original; btn.classList.remove("done"); }, 1500);
}

$("#app").addEventListener("click", (e) => {
  const pick = e.target.closest("[data-decide]");
  const other = e.target.closest("[data-decide-other]");
  const gdd = e.target.closest("[data-gdd]");
  const copy = e.target.closest(".session-copy");
  if (pick) {
    sendDecision(pick.getAttribute("data-decide"), Number(pick.getAttribute("data-idx")), null, pick);
  } else if (other) {
    const note = prompt("¿Cómo se resuelve? (una línea, queda en decisions.json)");
    if (note === null || !note.trim()) return;
    sendDecision(other.getAttribute("data-decide-other"), null, note.trim(), other);
  } else if (gdd) {
    openGdd(gdd.getAttribute("data-gdd"));
  } else if (copy) {
    copyTrigger(copy);
  }
});

$("#gdd-modal-close").addEventListener("click", closeGdd);
$("#gdd-modal").addEventListener("click", (e) => { if (e.target.id === "gdd-modal") closeGdd(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#gdd-modal").classList.contains("open")) closeGdd();
});

(async function(){
  if (window.__SNAPSHOT__) { CAPS = window.__SNAPSHOT__.capabilities || CAPS; render(window.__SNAPSHOT__); return; }  // bundle viejo, ya no se genera
  for (const url of ["api/snapshot", "snapshot.json"]) {
    try {
      const r = await fetch(url, {cache: "no-store"});
      if (!r.ok) continue;
      const data = await r.json();
      CAPS = data.capabilities || CAPS;
      render(data);
      return;
    } catch (e) { /* probar el siguiente */ }
  }
  $("#app").innerHTML = `<div class="empty">No encontré el snapshot.
    Corré <code>python collect.py</code> en studio/modo-god/.</div>`;
  $("#meta").textContent = "sin datos";
})();
</script>
