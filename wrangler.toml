name = "obscuro-lux-site"
compatibility_date = "2026-06-26"
main = "src/index.js"

# Sitio del estudio. deploy/ se sirve vía el binding ASSETS. El único código de
# Worker que hay es el redirect de lux. -> apex/#/lux (src/index.js, decisions.json
# id lux-subdomain-scope). run_worker_first=true es necesario: sin eso, Cloudflare
# sirve paths que matchean un asset (como "/") directo, sin pasar por el Worker --
# la raíz de lux. nunca hubiera visto el redirect (probado 13/8, no era cache).
#
# ⚠️ `directory` DEBE apuntar a deploy/, nunca a la raíz del repo.
# En la raíz vive index.html, que es el comparador de exploración de diseño
# ("Landing (3 variaciones)"): crashea en React y deja el dominio en pantalla negra.
# El sitio de verdad es deploy/index.html ("Estudio de diseño y desarrollo").
#
# Este Worker tiene atados obscuromediaworks.com.ar, www. y lux.
# Deploy: `npm run deploy`. Ver DEPLOY.md.

[assets]
directory = "./deploy"
binding = "ASSETS"
run_worker_first = true
